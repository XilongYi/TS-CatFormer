# configs/trainer/single.yaml
_target_: pytorch_lightning.Trainer

max_epochs: ${run.max_epochs}

# Device settings
accelerator: gpu        
devices: 1              
strategy: auto           
use_distributed_sampler: false

# Precision and performance
precision: 16-mixed
accumulate_grad_batches: 1
log_every_n_steps: 10
check_val_every_n_epoch: 1

# These are usually injected by code rather than hard-coded in the trainer
logger: null
callbacks: null
