# @package _global_
defaults:
  - override /routine@_global_.routine: crf_predict
  - override /dataset@_global_.dataset: complex_pocket_seq_data
  - override /dataloader@_global_.dataloader: no_struct_loader
  - override /dataset/merge_sdf_pdb@_global_.dataset.merge_sdf_pdb: merge_sdf_pdb_by_residues_near_ligand
  - override /dataset/add_asites_label@_global_.dataset.add_asites_label: noop_add
  - override /dataset/get_valid_item@_global_.dataset.get_valid_item: asites_crf
  - override /dataset/assign_label2x@_global_.dataset.assign_label2x: crf
  - override /model@_global_.model: ts_catformer
  - override /model/task_head@_global_.model.task_head: crf
  - _self_

experiment_name: predict_crf
data:
  csv:
    train_csv_path: null
    valid_csv_path: null
    inference_csv_path: data/ZENzyme-19/ZENzyme-19.csv
    reaction_csv_path: data/ZENzyme-19/reaction2idx.csv
    substrate_csv_path: data/ZENzyme-19/substrate2idx.csv
    product_csv_path: null
    sequence_csv_path: data/ZENzyme-19/protein2idx.csv
  paths:
    tmp_dir: data/tmp/crf_zen19
    complex_pocket_folder: data/ZENzyme-19/pocket
    protein_only_folder: data/ZENzyme-19/pocket
    ligand_folder: null
  embedding:
    save_dir_base: data/tmp/embedding
    dataset_name: zen19
    sequence_output: t5_global_em
    load_substrate_embedding: true
    load_product_embedding: false
    load_sequence_embedding: true
    load_pocket_embedding: true
    load_reaction_fp_embedding: false
    load_reaction_embedding: true
    fingerprint:
      rxn_fp_emb_path: null
      rxn_fp_mask_path: null
  dataset_mode: global_pocket_seq
run:
  max_epochs: 100
  is_train: false
  batch_size: 128
optimization:
  peak_lr: 1.5e-04
  weight_decay: 1.0e-05
  warmup_ratio: 0.05
  end_lr: 1.0e-09
ts_reaction:
  selected_key: 2d_mask_pretrain_plus_ts
  filter_valid: false
checkpoint:
  path: null
  mode: weights
seed:
  values: [0]
  deterministic: false
model:
  freeze_graphormer: false
predict:
  output_csv_path: data/ZENzyme-19/predictions.csv
mode:
  name: crf
  task: catalytic_reaction_feasibility_prediction
  flags:
    if_reload: true
  monitor:
    metric: val_auc_crf
    mode: max
    filename: rpre-best-2511-{epoch:02d}-{val_auc_crf:.4f}
