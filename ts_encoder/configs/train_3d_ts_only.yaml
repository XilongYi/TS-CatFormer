seed: 0
use_cuda: true
device: gpu
data:
  source_type: presplit_coordinate
  data_folder: data/TS/rdb7
  train_coordinate: train_mace_mp_ts.npz
  val_coordinate: val_mace_mp_ts.npz
  test_coordinate: test_mace_mp_ts.npz
  column_mapping:
    smiles: smiles
    ts_label: dE0
dataset:
  precompute_all: true
  cache: true
  cache_path: data/tmp/ts_graphs
  use_bond_change_label: false
  cache_name_prefix: train_3d_ts_only
dataloader:
  batch_size: 50
  num_workers: 0
  pin_memory: true
  shuffle_train: false
model:
  encoder_type: feature_relu
  hidden_channels: 900
  depth: 2
  residual: true
  block_dropout: 0.0
  head_hidden_size: 300
  head_num_hidden_layers: 0
  head_dropout: 0.0
  pool: add
  feature_in_channels: 256
  feature_out_channels: 512
  feature_hidden_channels: 128
  features_dropout: 0.1
  modified_in_channels: 622
task:
  type: regression_train
  epochs: 100
  patience: 100
  min_delta: 0.01
  clip_grad_norm: true
  clip_grad_norm_value: 1.0
  checkpoint_dir: checkpoints/ts_encoder/3d_ts_only
  use_pretrained_model: false
  save_model_parameters: true
optimizer:
  lr: 0.001
  weight_decay: 0.01
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  amsgrad: false
scheduler:
  num_warmup_steps: 10
  num_cycles: 0.5
loss:
  reduction: sum
